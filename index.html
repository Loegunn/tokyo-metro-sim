<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京地下鉄 車内案内ディスプレイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --uguisu:#9ACD32;--uguisu-deep:#5E8A0E;--ink:#15171A;--soft:#5A6068;--paper:#fff;
  --room:#DFE0DB;--rule:#D8DAD4;--plate:#2B2F35;--alert:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--room);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",
              "Microsoft JhengHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px}
.unit{position:relative;width:min(1020px,100%);background:var(--paper);border-radius:6px;
  box-shadow:0 18px 44px -26px rgba(0,0,0,.55);overflow:hidden}
/* .screen：普通模式下純粹係透明包裝（display:contents令佢喺layout度
   「隱形」，bar/main/tf/map同冇呢層包裝時排版完全一樣）；乘客模式先
   會將佢變返一個有實體box嘅置中卡片，見返落面 .unit.passenger .screen。 */
.screen{display:contents}
.unit.passenger{
  position:fixed;inset:0;width:100vw;height:100vh;max-width:100vw;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:28px;box-sizing:border-box;
  background:#1B1D1F;border-radius:0;box-shadow:none;overflow:auto;z-index:1000;
}
.unit.passenger .ctl,.unit.passenger .audio,.unit.passenger .note{display:none}
.unit.passenger .screen{
  display:block;width:min(1300px,94vw);flex:0 0 auto;
  border-radius:12px;overflow:hidden;background:var(--paper);
  box-shadow:0 24px 60px -28px rgba(0,0,0,.6);
}
/* 版本號喺乘客模式唔隱藏（保持「低調可查閱」），改做全螢幕右下角
   一粒細細嘅浮動字，唔佔主要資訊區。 */
.unit.passenger .ver{
  display:block;position:fixed;bottom:10px;right:16px;
  background:transparent;color:#6B716C;font-size:9px;padding:0;z-index:1001;
}
.passenger-toggle{position:absolute;top:9px;right:9px;z-index:1010;width:30px;height:30px;
  border-radius:50%;background:rgba(0,0,0,.28);color:#fff;border:none;font-size:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;
  transition:opacity .2s;padding:0}
.passenger-toggle:hover,.passenger-toggle:focus-visible{opacity:1}
.unit.passenger .passenger-toggle{position:fixed;top:16px;right:16px;opacity:.75;width:36px;height:36px;font-size:16px}
/* 乘客模式：顯示屏隨視窗適度放大（保留橫長比例），方便遠距離觀看 */
.unit.passenger .next{padding:32px 34px 22px}
.unit.passenger .name{font-size:clamp(38px,6vw,92px)}
.unit.passenger .kana{font-size:16px}
.unit.passenger .romaji{font-size:19px}
.unit.passenger .here{padding:24px 24px 20px}
.unit.passenger .here .h-name{font-size:36px}
.unit.passenger .map{padding:26px 0 10px}
.unit.passenger .rail{height:112px}
.unit.passenger .track{top:31px}
.unit.passenger .dot{margin-top:29px}
.unit.passenger .train{top:3px}
.unit.passenger .s-name{font-size:13.5px}
.unit.passenger .bar{padding:12px 24px}
.unit.passenger .bar-line{font-size:19px}

.bar{background:var(--uguisu);display:flex;align-items:center;gap:13px;padding:9px 18px}
.jy{width:29px;height:29px;border-radius:50%;background:#fff;color:var(--uguisu-deep);
  display:grid;place-items:center;font-weight:900;font-size:12.5px;flex:0 0 auto}
.bar-line{font-weight:900;font-size:16px;color:#1F2A05;letter-spacing:.06em;white-space:nowrap}
.bar-dir{margin-left:auto;font-weight:700;font-size:13px;color:#2B3A08;
  background:rgba(255,255,255,.55);padding:4px 12px;border-radius:2px;letter-spacing:.08em;
  white-space:nowrap;flex:0 0 auto}

/* ── 主表示：長站名保護 ── */
.main{display:grid;grid-template-columns:minmax(0,1fr) 236px}
.next{padding:22px 24px 16px;min-width:0;overflow:hidden}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.5em;color:var(--soft);height:21px}
.eyebrow.hot{color:var(--alert)}
.row{display:flex;align-items:flex-start;gap:16px;min-width:0}
.name-wrap{min-width:0;flex:1 1 auto;overflow:hidden}
.name{
  font-weight:900;line-height:1.02;
  font-size:clamp(30px,7.4vw,74px);
  letter-spacing:.05em;margin:3px 0 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;
}
.read{display:flex;align-items:baseline;gap:13px;flex-wrap:nowrap;min-width:0;overflow:hidden}
.kana{font-size:14px;color:var(--soft);letter-spacing:.24em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.romaji{font-size:16px;font-weight:500;letter-spacing:.09em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.plate{flex:0 0 auto;text-align:center;border:3px solid var(--plate);border-radius:6px;
  padding:5px 9px 6px;min-width:70px;margin-top:4px}
.plate .l{font-size:11px;font-weight:900;color:var(--uguisu-deep);letter-spacing:.1em}
.plate .n{font-size:24px;font-weight:900;line-height:1;margin-top:1px}

.here{border-left:1px solid var(--rule);background:#F8F9F6;padding:18px 18px 14px;
  display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.here .cap{font-size:10.5px;font-weight:700;letter-spacing:.24em;color:var(--soft)}
.here .h-name{font-size:31px;font-weight:900;letter-spacing:.04em;line-height:1.1;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .15s}
.here .h-rom{font-size:12px;color:var(--soft);letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 開門／停站期間，大字（.name）已經顯示緊同一個站，右側細box唔應該
   再重複放一個一樣大嘅站名做重點——呢陣淡化返個站名、突出開門側／
   車門狀態先啱。行駛／接近期間（doorFocus冇加）就保持原本大細，
   因為嗰陣細box顯示緊「出発駅」（同大字唔同站），唔算重複。 */
.here.doorFocus .h-name{font-size:17px;color:var(--soft);font-weight:700;letter-spacing:.02em}
.here.doorFocus .h-rom{display:none}
.here.doorFocus .door{margin-top:6px;padding-top:8px}
.here.doorFocus .d-txt{font-size:14px}
.here.doorFocus .d-side{font-size:13px}
.door{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:10px}
.d-txt{font-size:11.5px;font-weight:700;color:var(--soft);line-height:1.4}
.d-txt.open{color:var(--alert)}
.d-side{font-size:10.5px;color:var(--soft);margin-top:2px;font-weight:500}
.d-side b{color:var(--uguisu-deep);font-weight:900}
.d-side.unknown{color:#AEB4B8;font-style:italic}
#dL,#dR{transition:fill .25s}
#dL.hi,#dR.hi{fill:var(--uguisu-deep);opacity:.5}
#dL.flash,#dR.flash{opacity:1;animation:doorPulse 1s ease-in-out infinite}
@keyframes doorPulse{0%,100%{fill:var(--uguisu-deep)}50%{fill:var(--uguisu)}}
@media (prefers-reduced-motion:reduce){
  #dL.flash,#dR.flash{animation:none;opacity:1;fill:var(--uguisu-deep)}
}

.tf{padding:0 24px 18px;display:flex;gap:11px;align-items:flex-start;min-height:36px}
.tf-cap{font-size:10.5px;font-weight:700;color:var(--soft);letter-spacing:.14em;
  padding-top:5px;flex:0 0 auto;white-space:nowrap}
.tf-list{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{font-size:12px;padding:3px 9px 4px;border-radius:2px;background:#F2F3EF;
  border-left:5px solid var(--c,#999);white-space:nowrap}
.tf-none{font-size:12px;color:#A7ADB2;padding-top:5px}

.map{border-top:1px solid var(--rule);background:linear-gradient(#FAFBF8,#F0F2ED);
  padding:18px 0 6px;overflow:hidden;position:relative}
.map::before,.map::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:3}
.map::before{left:0;background:linear-gradient(90deg,#F4F5F1,transparent)}
.map::after{right:0;background:linear-gradient(-90deg,#F4F5F1,transparent)}
.rail{position:relative;height:92px;will-change:transform}
.track{position:absolute;top:25px;height:8px;background:var(--uguisu);border-radius:4px}
.stop{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:100px;overflow:hidden}
.dot{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--uguisu-deep);
  margin:23px auto 0;position:relative;z-index:2}
.stop.on .dot{background:var(--plate);border-color:var(--plate);transform:scale(1.25)}
.s-name{font-size:11.5px;font-weight:700;margin-top:7px;color:var(--soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.stop.on .s-name{color:var(--ink)}
.s-no{font-size:9px;color:#AEB4B8;margin-top:1px}
.train{position:absolute;top:-3px;z-index:4;transform:translateX(-50%)}
.train svg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}

.audio{display:flex;align-items:center;gap:11px;padding:11px 18px;
  background:#EEF3E2;border-top:1px solid var(--rule)}
.audio.live{background:#F7F8F5}
.audio .st{font-size:11.5px;color:var(--soft);line-height:1.5}
.audio .st b{color:var(--uguisu-deep)}
.audio .st.bad b{color:var(--alert)}
#btnSound{background:var(--uguisu-deep);border-color:var(--uguisu-deep);color:#fff;
  padding:8px 16px;font-size:13.5px;flex:0 0 auto}
.audio.live #btnSound{background:#fff;border-color:#C9CCC4;color:var(--ink)}

.ctl{border-top:1px solid var(--rule);background:#F7F8F5;padding:12px 18px;
  display:flex;gap:15px;align-items:center;flex-wrap:wrap}
.grp{display:flex;gap:7px;align-items:center}
.lbl{font-size:10.5px;font-weight:700;color:var(--soft);letter-spacing:.12em}
button,select{font:inherit;font-size:13px;font-weight:700;border:1px solid #C9CCC4;
  background:#fff;color:var(--ink);padding:6px 12px;border-radius:3px;cursor:pointer}
select{font-weight:500;padding:6px 8px}
button:hover,select:hover{border-color:var(--uguisu-deep)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--uguisu);outline-offset:2px}
button[aria-pressed="true"],button.on{background:var(--uguisu-deep);border-color:var(--uguisu-deep);color:#fff}
.seg button.pending{box-shadow:inset 0 0 0 2px var(--uguisu-deep);color:var(--uguisu-deep);font-style:italic}
.seg button[aria-pressed="true"].pending{box-shadow:none} /* 理論上唔會同時發生，保險擋住 */
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px;padding:6px 11px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
input[type=range]{width:88px;accent-color:var(--uguisu-deep);cursor:pointer}
.note{padding:8px 18px 15px;font-size:10.5px;color:#8A9096;line-height:1.6;background:#F7F8F5}
.note b{color:var(--uguisu-deep)}
.bgHint{font-size:10px;color:#9AA09B}
/* 「全部靜音」開咗嗰陣用返alert紅色，唔好同其他「開啟中」嘅綠色toggle
   （例如運行中／背景播放）混淆——綠色喺呢個app代表「正常運作緊」，
   但全部靜音係「刻意收晒聲」嘅狀態，用紅色先夠清楚分得出兩者唔同。 */
#btnMuteAll[aria-pressed="true"]{background:var(--alert);border-color:var(--alert);color:#fff}
.ver{padding:0 18px 8px;font-size:9.5px;color:#B7BCB2;background:#F7F8F5;text-align:right;
  letter-spacing:.04em;user-select:text}

@media (max-width:760px){
  body{padding:0}.unit{border-radius:0}
  .main{grid-template-columns:1fr}
  .here{border-left:0;border-top:1px solid var(--rule);flex-direction:row;align-items:center;
    gap:14px;padding:12px 16px}
  .here .h-name{font-size:22px;margin:0}.here .h-rom{display:none}
  .door{margin:0 0 0 auto;padding:0;flex-direction:column;align-items:flex-end;gap:2px}
  .next{padding:18px 16px 12px}.tf{padding:0 16px 14px}
  .eyebrow{letter-spacing:.3em;font-size:12.5px}
  .ctl,.audio{padding:10px 12px;gap:10px}
  .name{font-size:clamp(26px,8vw,44px)}
}
@media (prefers-reduced-motion:reduce){.stop.on .dot{transform:none}}
</style>
</head>
<body>
<div class="unit">
  <button class="passenger-toggle" id="btnPassenger" title="乘客模式（隱藏控制項，全螢幕顯示）">⛶</button>
  <div class="screen">
  <div class="bar">
    <div class="jy" id="jyBadge">JY</div><div class="bar-line" id="lineName">山手線</div>
    <div class="bar-dir" id="dirLabel">外回り</div>
  </div>

  <div class="main">
    <div class="next">
      <div class="eyebrow" id="eyebrow">つぎは</div>
      <div class="row">
        <div class="name-wrap">
          <div class="name" id="nName">有楽町</div>
          <div class="read"><span class="kana" id="nKana">ゆうらくちょう</span>
            <span class="romaji" id="nRom">Yūrakuchō</span></div>
        </div>
        <div class="plate"><div class="l" id="plateL">JY</div><div class="n" id="nNo">02</div></div>
      </div>
    </div>
    <div class="here" id="hereBox">
      <div class="cap" id="hereCap">ただいまの駅</div>
      <div class="h-name" id="cName">東京</div>
      <div class="h-rom" id="cRom">Tokyo · JY01</div>
      <div class="door">
        <svg width="42" height="30" viewBox="0 0 42 30" aria-hidden="true">
          <rect x="1" y="1" width="40" height="28" rx="2" fill="#EDEFEA" stroke="#C3C7BE"/>
          <rect id="dL" x="3" y="3" width="18" height="24" fill="#fff" stroke="#8A9096"/>
          <rect id="dR" x="21" y="3" width="18" height="24" fill="#fff" stroke="#8A9096"/>
        </svg>
        <div>
          <div class="d-txt" id="dTxt">ドア閉</div>
          <div class="d-side" id="dSide"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tf"><div class="tf-cap" id="tfCap">のりかえ</div><div class="tf-list" id="tfList"></div></div>

  <div class="map">
    <div class="rail" id="rail">
      <div class="track" id="track"></div>
      <div class="train" id="train">
        <svg width="46" height="26" viewBox="0 0 46 26">
          <path d="M6 3h30c5 0 9 4 9 9v9a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3v-9c0-5 2-9 5-9z" fill="#F2F4F0" stroke="#2B2F35" stroke-width="2"/>
          <rect id="trainStripe" x="1" y="12" width="44" height="5" fill="#9ACD32"/>
          <path d="M33 6h5c3 1 5 3 6 6h-11z" fill="#2B2F35" opacity=".85"/>
          <rect x="7" y="6" width="7" height="5" rx="1" fill="#2B2F35" opacity=".7"/>
          <rect x="17" y="6" width="7" height="5" rx="1" fill="#2B2F35" opacity=".7"/>
        </svg>
      </div>
    </div>
  </div>
  </div>

  <div class="audio" id="audioBar">
    <button id="btnSound">🔊 開聲</button>
    <button id="btnTestVoice" title="即場測試手機報站語音，會喺下面顯示逐步結果">🔎 測試報站</button>
    <div class="st" id="audioSt">撳「開聲」啟動車廂聲同報站。通咗會即刻「叮」一聲。</div>
    <div class="st" id="voiceDiag" style="display:none;color:var(--alert)"></div>
  </div>

  <div class="ctl">
    <button id="btnRun" class="on">▶ 運行中</button>
    <div class="grp"><span class="lbl">背景播放</span>
      <button id="btnBg" aria-pressed="true" title="開啟後，切換到其他分頁工作時，行程、車廂聲同報站會繼續；手動暫停仍然優先，暫停咗唔會因為返嚟分頁就自動繼續">開啟</button>
      <span class="bgHint">切換分頁後繼續播放</span></div>
    <div class="grp"><span class="lbl">路線</span><select id="selLine"></select></div>
    <div class="grp"><span class="lbl">方向</span>
      <div class="seg" id="dirSeg"></div></div>
    <div class="grp"><span class="lbl">起點</span><select id="selStart"></select></div>
    <div class="grp"><span class="lbl">行車速度</span>
      <div class="seg" id="spdSeg">
        <button data-spd="1" aria-pressed="true">×1</button>
        <button data-spd="3" aria-pressed="false">×3</button>
        <button data-spd="8" aria-pressed="false">×8</button>
      </div></div>
    <div class="grp"><span class="lbl">報站語速</span>
      <input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="0.95"></div>
    <div class="grp"><span class="lbl">車廂聲</span>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="0.4"></div>
    <button id="btnVoice" aria-pressed="true" title="淨係開／關日英報站，車廂聲唔受影響">🔊 日＋英</button>
    <div class="grp"><span class="lbl">全部靜音</span>
      <button id="btnMuteAll" aria-pressed="false" title="連車廂聲、路軌聲都一齊即刻收埋，唔止關報站；解除之後會跟返你原本嘅車廂聲音量同報站設定">關閉</button></div>
  </div>
  <div class="note" id="footnote">
    <b>開門方向</b>資料源自非官方鐵道部落格整理（内回り 30 站有多個來源互相印證；外回り 僅田端～田町段及澀谷站有確證），車站改建會令方向改變，僅供沉浸感參考，未確認嘅站會如實標示「未確認」而唔會亂估。
  </div>
  <div class="ver" id="appVer"></div>
</div>

<script>
/* ═══ 版本號 ═══
   之後每次「正式交付」都要跟住呢個規則升版：修bug/文字/小幅調整＝
   patch（v1.0→v1.0.1）；加新功能/明顯體驗改善＝minor（v1.0.1→v1.1）；
   大幅改版/主要架構更新＝major（v1.1→v2.0）。同一次工作入面嘅中間
   存檔唔使跟住升，以正式交付做單位。呢個常數係全個程式讀版本號嘅
   唯一source，介面顯示（#appVer）同交接文件都要對得住呢度。
   v1.0＝2026-09-10之前歷次交付嘅基準（冇正式版本號紀錄，追溯訂為
   v1.0）；v1.0.1＝暫停/跳站恢復漏播、倍速取消漏保護、行駛途中切
   方向teleport 三個bug修正＋版本號系統本身；v1.1＝加入電腦背景
   播放（切換分頁後行程／車廂聲／報站繼續）＋乘客全螢幕模式重新
   排版（置中、放大、停站時右側減少重複資訊）；v1.2＝新增真正
   「全部靜音」按鈕（連車廂聲都一齊收埋，唔止關報站）；v1.2.1
   ＝真機report「有車廂聲但完全冇報站把口」，加強手機語音解鎖／
   keep-alive，並加咗螢幕上診斷提示；v1.2.2（呢一輪）＝真機screenshot
   證實iPhone Safari報站嗰刻getVoices()返0個語音，改為poll住等語音

   喺driveAudio()將sfx（成個音效graph嘅總gain node，所有效果都經
   佢先出去）嘅目標音量逼做0，而唔係直接改voiceOn／vol嘅數值本身
   ——咁樣解除全部靜音之後，車廂聲音量、日英報站呢兩個原本嘅設定
   會自動還原，唔使你自己再撳返。voiceTick()同speak()都加咗呢個
   flag做gate，同埋annReq/voicedAnn個機制令靜音期間錯過嘅報站，
   解除之後會啱啱好補播返「現正」嗰句，唔會漏、唔會播舊嘢。 */
let masterMute=false;
/* speechHiddenBlocked（v1.2.3新增）：分頁收埋咗嗰陣，瀏覽器用autoplay
   政策擋住speechSynthesis（錯誤碼not-allowed）。呢個flag令voiceTick()
   喺仲收埋住嘅時候唔好一直重試（否則每個tick試一次、洗版兼嘥電），
   個報站request會keep住pending，返到前台先補播返「現正」嗰句。 */
let speechHiddenBlocked=false;
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 環狀路線（山手線）：一圈行晒 N 個站，wrap 返轉頭。
   直線來回路線（銀座線）：模擬一條「去到總站自動调头」嘅虛擬長條，
   長度係 2×(N-1)，行到尾自動掉返轉頭，唔使額外狀態機。 */
function order(){
  const N=S.length;
  if(CUR.topology==='loop') return outer?S:[S[0],...S.slice(1).reverse()];
  const per=Math.max(2*(N-1),1);
  const seq=[];
  for(let m=0;m<per;m++){ const real=m<=N-1?m:per-m; seq.push(outer?S[real]:S[N-1-real]); }
  return seq;
}
const at=i=>{ const o=order(); return o[((i%o.length)+o.length)%o.length]; };
/* 直線來回路線行到終點會自動掉頭，但`outer`呢個「初始方向選擇」本身唔會變。
   開門邊、方向標籤、報站呢啲要跟返「宜家實際行緊去程定返程」先啱，唔可以
   淨係睇住冇更新過嘅`outer`——呢個正正就係之前個bug嘅根源。
   effOuter(i) 算返喺idx=i嗰陣，實際仲係咪同當初`outer`揀嗰個方向一致
   （true＝一致，用返door[1]／dirLabels[0]；false＝已經掉咗轉頭，
   要用door[0]／dirLabels[1]）。環狀路線（山手線）冇呢種「來回」結構，
   直接原封不動返返`outer`。 */
function effOuter(i){
  if(CUR.topology!=='linear') return outer;
  const N=S.length, per=Math.max(2*(N-1),1);
  const m=((i%per)+per)%per;
  /* m=0永遠代表「返到起點總站」——呢個位置可以係「啱啱出發」（第一次）
     或者「行完成個往返、返嚟起點」（完成一圈之後）兩種情況，兩種physically
     都應該算「返程」（跟返程嗰個方向嚟到呢個站），唔應該當佢屬於去程。
     所以去程（forwardLeg）淨係 m=1..N-1，m=0本身唔算入去程——修正咗
     「完成整個往返、索引返到循環起點時，仍會將抵達方向判成去程」嗰個bug。 */
  const forwardLeg = m>=1 && m<=N-1;
  return forwardLeg===outer;
}

/* ═══════════ 音響 ═══════════ */
let ac=null,sfx=null,nBuf=null,built=false,greeted=false;
let rollSrc,rollFilt,rollGain,vvA,vvB,vvFilt,vvGain,rumbleGain,clackNext=0;

function buildGraph(){
  if(built) return; built=true;
  sfx=ac.createGain(); sfx.gain.value=masterMute?0:vol; sfx.connect(ac.destination);
  const len=Math.floor(ac.sampleRate*2);
  nBuf=ac.createBuffer(1,len,ac.sampleRate);
  const d=nBuf.getChannelData(0); let lp=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1; lp=lp*.94+w*.06; d[i]=lp*5;}

  rollSrc=ac.createBufferSource(); rollSrc.buffer=nBuf; rollSrc.loop=true;
  rollFilt=ac.createBiquadFilter(); rollFilt.type='lowpass'; rollFilt.frequency.value=300;
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=48;
  rollGain=ac.createGain(); rollGain.gain.value=0;
  rollSrc.connect(rollFilt).connect(hp).connect(rollGain).connect(sfx); rollSrc.start();

  const rSrc=ac.createBufferSource(); rSrc.buffer=nBuf; rSrc.loop=true;
  const rF=ac.createBiquadFilter(); rF.type='lowpass'; rF.frequency.value=95;
  rumbleGain=ac.createGain(); rumbleGain.gain.value=.04;
  rSrc.connect(rF).connect(rumbleGain).connect(sfx); rSrc.start();

  vvA=ac.createOscillator(); vvA.type='sawtooth';
  vvB=ac.createOscillator(); vvB.type='square';
  vvFilt=ac.createBiquadFilter(); vvFilt.type='bandpass'; vvFilt.Q.value=5;
  vvGain=ac.createGain(); vvGain.gain.value=0;
  vvA.connect(vvFilt); vvB.connect(vvFilt); vvFilt.connect(vvGain).connect(sfx);
  vvA.frequency.value=60; vvB.frequency.value=90; vvA.start(); vvB.start();
  clackNext=ac.currentTime+.4;
}

function voiceDiag(msg,kind){
  /* kind：'warn'（紅，預設）／'ok'（綠）／'info'（灰）。傳空字串＝收埋。
     v1.2.2改：舊版淨係識「顯示」唔識「清返」，搞到語音遲啲先load好之後
     嗰句「搵唔到語音」嘅舊訊息仲繼續掛喺度，誤導人以為一直都冇語音。 */
  const el=$('voiceDiag'); if(!el) return;
  if(!msg){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='block'; el.innerHTML=msg;
  el.style.color = kind==='ok' ? 'var(--uguisu-deep)' : kind==='info' ? 'var(--soft)' : 'var(--alert)';
}
/* diagLog（v1.2.3新增）：舊版係「最後一句冚晒前面」，所以一張screenshot
   淨係睇到最尾嗰個錯誤，睇唔到之前發生過乜、亦唔知當時分頁係咪收埋咗。
   而家改做保留最近幾條，每條都有時間同「當時分頁收埋咗未」，一張圖
   就睇晒成個經過。 */
let diagLog=[];
function diagPush(msg){
  const t=new Date().toTimeString().slice(0,8);
  diagLog.push(`<span style="opacity:.6">${t}${document.hidden?' · 分頁收埋咗':''}</span>　${msg}`);
  if(diagLog.length>5) diagLog.shift();
  voiceDiag(diagLog.join('<br>'),'warn');
}
/* ═══ 語音清單載入（v1.2.2新增）═══
   2026-09-10真機screenshot證實：iPhone Safari喺報站嗰刻，
   speechSynthesis.getVoices() 返返嚟係「0個語音」。iPhone本身梗係有
   朗讀語音嘅，所以真正嘅問題唔係「冇裝語音」，而係 iOS Safari 一個
   出名嘅行為——getVoices() 一開始會返空array，語音清單係之後先
   非同步load好，而 voiceschanged 事件喺 iOS 上出名唔可靠（可能遲、
   可能唔fire）。語音清單空嘅時候，utterance 揀唔到 voice，好多引擎
   就會靜靜哋唔出聲（唔會報error）——啱啱好對得上「有車廂聲、冇報站、
   又冇任何error」呢個現象。
   所以唔可以再靠 voiceschanged 一個事件，要自己poll住等佢load好。 */
let voiceList=[], voicePolls=0, voicePollId=null;
function refreshVoices(){
  if(!window.speechSynthesis) return [];
  try{ voiceList=speechSynthesis.getVoices()||[]; }catch(e){ voiceList=[]; }
  return voiceList;
}
function startVoicePolling(){
  if(voicePollId||!window.speechSynthesis) return;
  voicePollId=setInterval(()=>{
    voicePolls++;
    const v=refreshVoices();
    if(v.length){
      clearInterval(voicePollId); voicePollId=null;
      const ja=v.some(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'));
      voiceDiag(ja?'':`ℹ️ 呢部裝置有 ${v.length} 個朗讀語音，但入面冇日文語音，日文嗰段會用預設語音讀（英文照常）。`, 'info');
    }else if(voicePolls>40){ // 約20秒都仲係0個
      clearInterval(voicePollId); voicePollId=null;
      voiceDiag('⚠️ 等咗20秒，呢部裝置嘅瀏覽器仍然報告「0個朗讀語音」。可以撳下面粒「🔎 測試報站」睇下實際情況。','warn');
    }
  },500);
}
function pickVoice(lang){
  const list=voiceList.length?voiceList:refreshVoices();
  const p=lang.slice(0,2).toLowerCase();
  return list.find(x=>x.lang&&x.lang.toLowerCase().startsWith(p))||null;
}
let speechPrimed=false;
function primeSpeech(){
  /* iOS Safari／部份Android瀏覽器淨係俾「用戶手指嗰下撳落」呢個瞬間
     直接call speak()先真係會出聲，之後嗰啲靠setTimeout延遲先call嘅
     speak()（例如報站，delay 700~1100ms）有機會靜靜哋失敗，冇錯誤、
     都冇聲。所以要喺呢個撳掣嘅同一個瞬間，搶閘講返日／英兩句嘢
     「解鎖」，之後成個phase啲報站先有機會出到聲。
     2026-09-10真機report：車廂聲（Web Audio）正常但完全冇報站把口，
     兩個可能成因一齊處理——(1) 之前淨係prime一句、淨係得0音量，
     部份引擎可能將0音量utterance當「無聲、唔算真正播過」，唔會真
     正解鎖；(2) 頁面reload或者上次殘留嘅queue卡住咗speechSynthesis
     ——所以呢度先cancel()清一清，再用返有少少音量嘅日／英各一句
     去prime，兩種語言分開解鎖。如果連呢句都error，就即刻喺螢幕度
     顯示返瀏覽器嘅實際錯誤原因，等下次唔使再靠估。 */
  if(speechPrimed||!window.speechSynthesis) return;
  speechPrimed=true;
  refreshVoices(); startVoicePolling();   // v1.2.2：即刻攞一次，攞唔到就poll住等
  try{
    speechSynthesis.cancel();
    [['ja-JP','あ'],['en-US','a']].forEach(([lang,text])=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang; u.volume=.01; u.rate=10;
      /* 解鎖句失敗唔使每次都寫一行——被擋（not-allowed）呢個情況，真正
         有用嗰句訊息由報站嗰邊嘅onerror負責寫，呢度再寫就會洗版，反而
         迫走咗有用嘅資料。淨係報告其他比較罕見嘅原因。 */
      u.onerror=e=>{ const w=e.error||'未知';
        if(w!=='canceled'&&w!=='interrupted'&&w!=='not-allowed') diagPush(`語音解鎖失敗（${lang}，${w}）。`); };
      speechSynthesis.speak(u);
    });
  }catch(e){ voiceDiag(`⚠️ 語音解鎖時發生錯誤：${e.message||e}`); }
  /* keep-alive：Chrome系瀏覽器有個已知bug，speechSynthesis靜咗一段
     時間之後就會卡住／自動暫停，之後再speak()都冇聲——定時pause()
     再resume()一次可以「拍醒」返佢，冇壞影響（冇嘢講緊嗰陣呢兩個
     call都係no-op）。 */
  if(!window.__speechKeepAlive){
    window.__speechKeepAlive=setInterval(()=>{
      try{
        if(window.speechSynthesis&&speechSynthesis.speaking){
          speechSynthesis.pause(); speechSynthesis.resume();
        }
      }catch(e){}
    },8000);
  }
}
function initAudio(){
  try{
    if(!ac){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC){ audioStatus('no-api'); return; }
      ac=new AC(); buildGraph();
    }
    if(ac.state!=='running'){
      ac.resume().then(()=>{ audioStatus(); ding(); }).catch(()=>audioStatus('blocked'));
    }else{ audioStatus(); ding(); }
    if(window.speechSynthesis){ speechSynthesis.resume(); primeSpeech(); }
  }catch(e){ audioStatus('blocked'); }
}
function ding(){ if(!greeted&&ac&&ac.state==='running'){ greeted=true; tone(880,0,.4,.18); tone(1175,.16,.5,.14); } }
function audioStatus(err){
  const bar=$('audioBar'), st=$('audioSt'), btn=$('btnSound');
  if(err==='no-api'){ st.className='st bad';
    st.innerHTML='<b>呢個瀏覽器唔支援 Web Audio</b>，試下用 Chrome、Edge 或者 Safari。'; return; }
  if(ac&&ac.state==='running'){
    bar.classList.add('live'); btn.textContent='🔈 音響已開';
    st.className='st';
    st.innerHTML='<b>音響運作中</b>　VVVF、路軌接口聲、ピンポーン、日英報站全部啟動咗。';
  }else{
    st.className='st bad';
    st.innerHTML='<b>瀏覽器封鎖緊聲音。</b>如果你係喺預覽視窗（iframe）入面睇，請下載個 HTML 檔再 double-click 用瀏覽器直接開。';
  }
}
/* touchPrime（v1.2.3新增）：Chrome系瀏覽器用autoplay政策gate住
   speechSynthesis，實測攞到嘅錯誤碼係not-allowed。單靠開頭「解鎖」
   一次唔夠——所以而家每次用戶郁下（撳畫面／撳掣／撳鍵盤）都會順手
   喺嗰一刻講一句聽唔到嘅嘢，令授權keep住係「新鮮」。刻意唔call
   cancel()（唔可以斬斷緊講緊嗰句報站），亦有4秒節流，唔會撳極都prime。 */
let lastPrime=0;
function touchPrime(){
  if(!window.speechSynthesis||masterMute) return;
  const now=Date.now();
  if(now-lastPrime<4000) return;
  lastPrime=now;
  try{
    const u=new SpeechSynthesisUtterance('.');
    u.volume=.01; u.rate=10;
    window.__primeKeep=u;            // 強引用，防止俾GC食咗
    speechSynthesis.speak(u);
  }catch(e){}
}
addEventListener('pointerdown',()=>{ initAudio(); touchPrime(); });
addEventListener('keydown',()=>{ initAudio(); touchPrime(); });

/* Page Visibility（v1.1改）：舊行為係「一收埋分頁就即刻suspend AudioContext
   同stopSpeech」；而家先睇bgPlayback呢個開關——開咗（而且running緊）
   就唔suspend、唔stopSpeech，改用setInterval（bgTick）頂替rAF令行程／
   音效／報站繼續；手動暫停（running=false）優先於背景播放，暫停緊
   嗰陣即使bgPlayback開咗都照舊suspend，唔會因為切走分頁而變成自動
   繼續行。返嚟前景嗰陣一律停走背景timer、重新對時基，並即刻補一次
   畫面／報站，等你返嚟即刻見到、聽到同現正行程一致嘅狀態，唔使等。 */
document.addEventListener('visibilitychange',()=>{
  tabHidden=document.hidden;
  if(tabHidden){
    if(bgPlayback&&running){
      startBgTimer();
    }else{
      stopBgTimer();
      if(ac&&ac.state==='running') ac.suspend();
      stopSpeech();
    }
  }else{
    stopBgTimer();
    speechHiddenBlocked=false;       // v1.2.3：返到前台，解除「後台被擋」狀態，等下面voiceTick()補播
    if(ac&&ac.state!=='running'&&built) ac.resume();
    last=performance.now();          // 避免返嚟嗰下 dt 爆錶
    if(ac) clackNext=ac.currentTime+.4;   // 重新對路軌聲嘅排程時基
    renderFrame();                   // 即刻同步返畫面，唔使等落一個rAF先慢慢追
    voiceTick();                     // 補返返嚟嗰下應該有嘅報站（如果背景冇播）
  }
});

function tone(f,dly,dur,g0,type){
  if(!ac||!sfx) return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  const s=ac.currentTime+dly;
  g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(g0,s+.015);
  g.gain.exponentialRampToValueAtTime(.0004,s+dur);
  o.connect(g).connect(sfx); o.start(s); o.stop(s+dur+.05);
}
function noiseBurst(dly,dur,g0,freq,Q,type){
  if(!ac||!nBuf||!sfx) return;
  const s=ac.createBufferSource(); s.buffer=nBuf;
  s.playbackRate.value=1+Math.random()*.4;
  const f=ac.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=Q||1;
  const g=ac.createGain(); const st=ac.currentTime+dly;
  g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(g0,st+.006);
  g.gain.exponentialRampToValueAtTime(.0004,st+dur);
  s.connect(f).connect(g).connect(sfx); s.start(st); s.stop(st+dur+.05);
}
function clackPair(a0,amp,rf){
  noiseBurst(a0,.09,amp,780,1.4); noiseBurst(a0+.055,.11,amp*.8,430,1.2);
  noiseBurst(a0+.16*rf,.09,amp*.72,700,1.4); noiseBurst(a0+.215*rf,.11,amp*.58,400,1.2);
}
function scheduleClacks(){
  if(!ac||ac.state!=='running'||v<.06||!running||(tabHidden&&!bgPlayback)||masterMute) return;
  const now=ac.currentTime;
  if(clackNext<now) clackNext=now+.03;
  const interval=(1.35/(0.18+v*1.5))/Math.max(speed,1);
  while(clackNext<now+.35){ clackPair(clackNext-now,.075*Math.pow(v,.8),1/(0.25+v)); clackNext+=interval; }
}
const chimePing=()=>{ tone(1050,0,.75,.20); tone(788,.30,.95,.18); };
const chimeDoor=()=>{ for(let i=0;i<4;i++) tone(1180,i*.34,.17,.15); };
const airRelease=g=>noiseBurst(0,.85,g||.11,2600,.7,'highpass');
const doorAir=()=>noiseBurst(0,.45,.07,3400,.7,'highpass');

/* ═══ 語音：保留 utterance 全域引用，防止播放中途被 GC 回收 ═══
   speak()嘅排隊策略：正常速度（×1）嗰陣，新嘅announce唔會打斷緊
   出緊聲嗰句（例如轉乘站多嘅站，まもなく個轉乘名單未讀完），會排
   隊等講完先接住講下一句，等長轉乘名單有機會講完全句，唔會俾下一
   個phase嘅報站打斷咗中途。快進（×3／×8）嗰陣就保留返舊有做法：
   即刻cancel舊嘅、開始新嘅，唔係就會越積越多、聲畫嚴重甩節。
   真正需要「即刻收晒聲、唔留低隊」嘅場合（切線／跳站／停低/靜音/
   分頁隱藏）一律用 stopSpeech()，唔經呢個排隊邏輯。 */
let queue=[], liveUtterances=[], speaking=false;
function stopSpeech(){
  genId++; // 令啱啱排緊隊、仲未播出嚟嘅delayed announce()即刻作廢，
           // 唔會夠鐘先喺已經暫停／靜音／收埋分頁之後先蹦出嚟
  queue=[]; speaking=false;
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function speak(list){
  if(!voiceOn||masterMute||!window.speechSynthesis) return;
  if(speed>1){
    /* 呢度cancel緊嘅嗰句舊utterance，個onend/onerror遲啲先到嘅話，
       如果冇bump genId，佢個myGen仲係啱嘅、會通過nextUtt()嘅代次
       檢查，誤將啱啱先排落去嘅新queue推咗一格（英文嗰句提早送出）。
       所以呢度都要同stopSpeech()一樣bump genId，令舊回呼即刻作廢。 */
    genId++;
    speechSynthesis.cancel(); liveUtterances=[]; queue=list.slice(); speaking=false; nextUtt(); return;
  }
  queue=queue.concat(list);
  if(!speaking) nextUtt();
}
function nextUtt(){
  if(!queue.length){ speaking=false; return; }
  speaking=true;
  const myGen=genId; // 記低呢句嘅代——如果播緊嗰陣stopSpeech()令代數變咗，
                      // 就代表呢句已經作廢，即使佢個onend/onerror遲咗先到
                      // 都唔可以再攞嚟推進（可能已經係新排緊隊）嗰個queue
  const [lang,text]=queue.shift();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=rate; u.pitch=lang==='ja-JP'?1.05:1;
  /* v1.2.2：改用pickVoice()／voiceList（會poll住等語音load好），唔再
     每次直接call getVoices()——iOS Safari早期call會返0個，之前就係
     因為咁，喺報站嗰刻誤判成「呢部裝置冇裝任何語音」並且將個誤導
     訊息掛咗喺螢幕度。真正冇語音定係只係未load好，交返俾polling同
     「🔎 測試報站」粒掣去分辨，呢度唔再落結論。 */
  const vo=pickVoice(lang);
  // 揀voice本身有可能掟error（例如個voice object已經過期／唔係真正嘅
  // SpeechSynthesisVoice），唔可以連累成句報站播唔到——揀唔到就照樣
  // 用lang交返俾瀏覽器自己決定。
  if(vo){ try{ u.voice=vo; }catch(e){} }
  liveUtterances.push(u);                 // 強引用，播完先放走
  const done=()=>{
    liveUtterances=liveUtterances.filter(x=>x!==u);
    if(myGen!==genId) return;             // 舊代嘅回呼，唔准再推進新queue
    nextUtt();
  };
  u.onend=done;
  u.onerror=e=>{
    /* v1.2.3：真機／桌面實測攞到嘅錯誤碼係 not-allowed——即係「瀏覽器
       擋咗」，唔係「冇語音」、亦唔係「引擎壞咗」。Chrome系瀏覽器會用
       autoplay政策去gate speechSynthesis：要頁面有用戶互動過先俾出聲，
       而且分頁收埋咗（後台）嗰陣好多時直接唔俾出聲。所以呢度分兩種
       情況處理，唔可以一律當成永久失敗： */
    const why=e.error||'未知';
    if(why==='canceled'||why==='interrupted'){ done(); return; }  // 我哋自己cancel嘅，正常
    if(why==='not-allowed'){
      if(tabHidden||document.hidden){
        /* 分頁收埋咗俾瀏覽器擋——唔係真係播唔到，係而家唔俾播。
           將個報站request還原做「未播」，並且記住而家係被擋狀態，
           等返到前台先補播返「現正」嗰句（用返annReq/voicedAnn同一套
           追趕機制，唔會爆隊、唔會播舊嘢）。 */
        speechHiddenBlocked=true;
        voicedAnn=annReq-1;
        diagPush('報站俾瀏覽器擋咗（not-allowed）——分頁喺後台。返到前台會自動補播。');
      }else{
        /* 前台都被擋＝用戶互動授權過期／未夠。即刻重新「解鎖」一次，
           下一句報站會再試。 */
        speechPrimed=false; primeSpeech();
        voicedAnn=annReq-1;
        diagPush('報站俾瀏覽器擋咗（not-allowed）。已即時重新解鎖，下一句會再試；如果一直擋，撳一下畫面任何位置就會回復。');
      }
      done(); return;
    }
    diagPush(`報站語音播放失敗（語言：${lang}，原因：${why}）。`);
    done();
  };
  speechSynthesis.speak(u);
}
if(window.speechSynthesis){
  speechSynthesis.onvoiceschanged=()=>{
    if(!speechSynthesis.getVoices().some(x=>x.lang.startsWith('ja'))&&ac&&ac.state==='running')
      $('audioSt').innerHTML='音響運作中，但你部機<b>未裝日文語音</b>，日文嗰段唔會出聲（英文照講）。裝咗系統語音包再 refresh 就得。';
  };
}
function announce(jp,en,delay){
  chimePing();
  const g=genId; // 記低嗰刻嘅「代數」，切線／跳站之後呢個舊報站就唔會再開聲
  setTimeout(()=>{ if(g===genId) speak([['ja-JP',jp],['en-US',en]]); },delay||1100);
}

/* ═══ 路線図 ═══ */
const rail=$('rail');
function strip(){
  [...rail.querySelectorAll('.stop')].forEach(e=>e.remove());

/* ═══ 表示 ═══ */
function doorSideText(st,i){
  const side = effOuter(i) ? st.door[1] : st.door[0];
  if(side==='L') return {cls:'', html:'<b>◀ 左側</b>ドアが開きます', side};
  if(side==='R') return {cls:'', html:'<b>右側 ▶</b>ドアが開きます', side};
  if(side==='R?') return {cls:'unknown', html:'<b>右側 ▶</b>（一般，實際睇當日月台）', side};
  if(side==='LR') return {cls:'unknown', html:'<b>◀ 左 ／ 右 ▶</b>兩邊都有可能，睇當日月台', side};
  return {cls:'unknown', html:'開く側は未確認', side:null};
}
function paintDoorHighlight(side){
  /* 開門方向色彩區分：即將開嗰道用線色高亮，另一道保持中性灰白；
     完全確定嘅先至加閃動（'soon'/'open' 階段），唔夠肯定嘅（R?／LR）
     淨係靜態高亮，唔閃，等用戶睇得出呢個係「有把握」定「僅供參考」。 */
  const dL=$('dL'), dR=$('dR');
  const hiL = side==='L'||side==='LR';
  const hiR = side==='R'||side==='R?'||side==='LR';
  const confident = side==='L'||side==='R';
  const flashing = confident && (phase==='soon'||phase==='open');
  dL.classList.toggle('hi',hiL); dR.classList.toggle('hi',hiR);
  dL.classList.toggle('flash', flashing && hiL);
  dR.classList.toggle('flash', flashing && hiR);
}
function paint(){
  setDirLabel(); // 直線來回路線掉頭後方向會變，每次畫面更新都要重新check
  const stopped=phase==='open'||phase==='dwell'||phase==='close';
  const cur=stopped?at(idx+1):at(idx), nx=stopped?at(idx+2):at(idx+1);
  const focus=stopped?cur:nx;
  /* 開門／停站期間，大字唔應該搶先跳去「再下一站」——應該突出顯示緊
     企喺邊個站（cur），等畫面同你個「ただいまの駅」細box對得上；
     去到關門／出發（close），大字先切返去下一站，回應返「大字即刻跳
     去再下一站，冧咗個現正停站嘅重點」呢個外部意見。 */
  const atStation = phase==='open'||phase==='dwell';
  const big = atStation ? cur : nx;
  $('nName').textContent=big.kanji; $('nName').title=big.kanji;
  $('nKana').textContent=big.kana;
  $('nRom').textContent=big.rom; $('nRom').title=big.rom;
  $('nNo').textContent=big.no;
  $('cName').textContent=cur.kanji; $('cName').title=cur.kanji;
  $('cRom').textContent=`${cur.rom} · ${CUR.badge}${cur.no}`;
  /* 停站（開門／停留）期間，大字（.name）已經顯示緊呢個站，右側細box
     唔應該再重複放一個一樣大嘅站名做重點——加返.doorFocus淡化站名、
     突出開門側／車門狀態。行駛／接近期間細box顯示緊「出発駅」（同
     大字唔同站），改返個標題字眼，唔好用「ただいまの駅」暗示緊列車
     停喺嗰度。 */
  $('hereCap').textContent = stopped ? 'ただいまの駅' : '出発駅';
  $('hereBox').classList.toggle('doorFocus', atStation);
  const eb=$('eyebrow');
  eb.classList.toggle('hot',phase==='soon'||phase==='close');
  eb.textContent=phase==='run'?'つぎは':phase==='soon'?'まもなく':phase==='close'?'まもなく発車':atStation?'ただいま':'つぎは';
  $('tfCap').textContent=`${focus.kanji}駅 のりかえ`;
  const L=$('tfList'); L.innerHTML='';
  if(!focus.tf.length) L.innerHTML='<span class="tf-none">のりかえはありません</span>';
  else focus.tf.forEach(([n,c])=>{const s=document.createElement('span');
    s.className='chip'; s.style.setProperty('--c',c); s.textContent=n; L.appendChild(s);});
  const ds=doorSideText(focus, idx+1), dEl=$('dSide');
  dEl.className='d-side '+ds.cls; dEl.innerHTML=ds.html;

}
function doors(a){
  const w=Math.max(18*(1-a),0);
  $('dL').setAttribute('width',w);
  $('dR').setAttribute('width',w); $('dR').setAttribute('x',39-w);
  const txt=$('dTxt'); txt.classList.toggle('open',a>.05);
  txt.textContent=a>.95?'ドア開':a>.05?(phase==='close'?'ドア閉まります':'ドア動作中'):'ドア閉';
}

/* ═══ 進行 ═══ */
function enter(p){
  if(p===phase) return;
  const prev=phase; phase=p;
  /* 注意：idx嘅推進要喺呢度、計算n之前就做好，唔可以放去落面先做——
     以前個bug就係calc咗n＝at(idx+1)先至先至idx++，搞到啱啱departure
     嗰下嘅『run』報站用咗舊嗰個idx，講咗返轉頭嗰個站（啱啱走咗嗰個），
     而唔係真正下一個站，畫面就啱（因為paint()喺idx++之後先call），
     單係把口講錯。而家先idx++／處理埋dirMode『alt』調頭，先計n，
     咁報站同畫面先會用返同一個、啱嘅idx。 */
  if(prev==='close'&&p==='run'){
    idx++;
    /* 山手線「每圈調頭」：order()喺loop拓撲底下，唔論外回り定内回り都會
       重新以東京（S[0]）做錨點0（[S0,S(N-1),S(N-2)...]咁重排），所以純粹
       將idx取負冇用——舊公式idx=-idx-1差一個站，會令調頭一刻嘅「現正
       所在站」錯計成上一個站（例如喺東京調頭，錯計成有樂町）。正確做法
       係idx=-idx（唔使-1），先會啱啱好將「現正所在站」對返做返同一個
       physical站（例如東京調頭之後，現正所在站仍然係東京，下一站先係
       神田／有樂町，睇邊個方向）。 */
    if(dirMode==='alt'&&++lapMark>=S.length){lapMark=0;outer=!outer;idx=-idx;setDirLabel();}
    else if(pendingDir!==null){
      /* 行駛途中／停站中撳咗方向掣，記低嘅pendingDir而家先真正生效——
         啱啱好喺呢一刻（現正呢程行完、開始下一程）套用，keep住抵達
         方向嘅站同開門資料完整，唔會半路teleport。 */
      const want=pendingDir==='out';
      if(CUR.topology==='loop'){
        if(want!==outer){ outer=want; idx=-idx; }
      }else if(want!==effOuter(idx)){
        const cur=at(idx), N=S.length, realIdx=S.findIndex(x=>x.no===cur.no);
        outer=want; idx = want ? realIdx : (N-1-realIdx);
      }
      setDirLabel();
      pendingDir=null;
    }
    strip();
  }
  annReq++; // 呢個phase轉換需要一句新報站——真正出唔出聲、播邊句交返voiceTick()判斷
  paint();
}
function voiceTick(){
  /* 將「畫面已更新」（enter()做嘅嘢）同「報站已經真正播咗」拆開：
     annReq每有新phase轉換就會加，voicedAnn追蹤上一次真正播咗嗰個代。
     暫停（running=false）／收埋分頁（tabHidden）期間annReq會繼續加
     （因為switchLine／jumpTo仍然會即刻reset phase畀你睇畫面預覽），
     但呢度會keep住唔播，等到真係running又冇hide先至，用返「現正」
     嘅idx／phase播返適用嗰句——資源到位先播，唔會恢復咗漏晒，亦
     唔會因為暫停期間phase靜靜哋變咗就當自動播過。 */
  if(annReq===voicedAnn) return;
  if(!running) return;
  if(tabHidden&&!bgPlayback) return; // 背景播放開咗先可以喺收埋分頁時繼續出聲
  if(masterMute) return; // 全部靜音期間keep住request pending，解除先補播返「現正」嗰句
  if(speechHiddenBlocked&&tabHidden) return; // 已知後台被擋，唔好逐個tick重試洗版，等返前台先
  voicedAnn=annReq;
  const p=phase, n=at(idx+1);
  const tfCap=n.tf.slice(0,3), tfMore=n.tf.length>3;
  const enTf=tfCap.map(x=>EN[x[0]]).filter(Boolean);
  const side=effOuter(idx+1)?n.door[1]:n.door[0];
  const sideJp=side==='L'?'左側の':side==='R'?'右側の':'';
  const sideEn=side==='L'?' on the left side':side==='R'?' on the right side':'';
  if(p==='run') announce(`次は、${n.kanji}、${n.kanji}です。`,`The next station is ${n.rom}.`);
  if(p==='soon') announce(
    `まもなく、${n.kanji}、${n.kanji}です。`+(tfCap.length?`${tfCap.map(x=>x[0]).join('、')}${tfMore?'ほか':''}は、お乗り換えです。`:''),
    `We will soon make a brief stop at ${n.rom}.`+(enTf.length?` Please change here for ${enTf.join(', ')}${tfMore?', and other lines':''}.`:''));
  if(p==='open'){ airRelease(.13); doorAir();
    announce(`${n.kanji}、${n.kanji}です。${sideJp}ドアが開きます。ご注意ください。`,
              `This is ${n.rom}. The doors${sideEn} will open.`,700); }
  if(p==='close'){ chimeDoor();
    const g=genId;
    setTimeout(()=>{ if(g===genId) speak([['ja-JP','ドアが閉まります。ご注意ください。'],
                          ['en-US','The doors are closing. Please watch your step.']]); },400);
    setTimeout(()=>{ if(g===genId) doorAir(); },1500);
  }
}

/* ═══ v1.1：時間推進／音效／畫面三件事拆開 ═══
   舊版全部揼晒喺loop()一個function度，靠rAF一路細細個dt咁行，冇問題；
   但rAF喺分頁收埋（tabHidden）嗰陣，瀏覽器根本唔會再call，所以背景
   播放一定要另外揾方法推進時間——用setInterval（bgTick）。但setInterval
   之間隔嘅時間可能好大（例如背景幾分鐘先先tick一次，甚至裝置瞓咗
   醒返嚟先觸發一次好大嘅dt），如果淨係set一次`t+=dt`就直接算phase，
   會漏晒中途應該行過嘅每一個phase／站，令idx錯亂。所以拆出嚟嘅
   advance(dt)會逐個phase邊界咁一步步行，唔理dt幾大都唔會漏call
   enter()、亦唔會令idx跳錯——但因為annReq/voicedAnn個機制，就算行
   足幾百次enter()，voiceTick()都淨係會播返「現正」嗰句，唔會將沿途
   錯過晒嘅報站一次過爆晒出嚟。 */
function phaseAt(tt){
  return tt<B.run?'run':tt<B.soon?'soon':tt<B.open?'open':tt<B.dwell?'dwell':'close';
}
function advance(dt){
  let guard=0;
  while(dt>1e-6&&guard++<2000000){
    const nextBound = t<B.run?B.run : t<B.soon?B.soon : t<B.open?B.open : t<B.dwell?B.dwell : CYCLE;
    const step=Math.min(dt,Math.max(nextBound-t,0));
    t+=step; dt-=step;
    if(t>=CYCLE-1e-9) t-=CYCLE;
    enter(phaseAt(t));
    if(step<=1e-9&&dt>1e-6){ t+=1e-6; dt-=1e-6; } // 保險：避開浮點誤差令step長期為0
  }
}
function driveAudio(dt,p){
  vPrev=v;
  if(p==='run'){ const e=t/T.run; v=e<.34?Math.pow(e/.34,.7):1-(e-.34)*.12; }
  else if(p==='soon'){ const e=(t-B.run)/T.soon; v=Math.max(0,Math.pow(1-e,1.6)*.88); }
  else v=0;
  accel=(v-vPrev)/Math.max(dt,1e-4);
  if(!ac||!sfx||ac.state!=='running') return;
  if(tabHidden&&!bgPlayback) return;
  sfx.gain.value+=((masterMute?0:vol)-sfx.gain.value)*.1; // 全部靜音：目標音量逼做0，解除返自動還原vol
  const on=running?1:0;
  rollGain.gain.value+=((Math.pow(v,1.4)*.5*on)-rollGain.gain.value)*.08;
  rollFilt.frequency.value=220+v*900;
  const sing=Math.min(1,Math.abs(accel)*7), f=58+v*330;
  vvA.frequency.value=f; vvB.frequency.value=f*1.49; vvFilt.frequency.value=f*2.4+300;
  vvGain.gain.value+=((sing*.055*on)-vvGain.gain.value)*.09;
  rumbleGain.gain.value=.03+v*.02;
  scheduleClacks();
}
function renderFrame(){
  // 淨係負責畫面（路軌位置、車頭位置、門動畫）——背景（tabHidden）唔
  // 使call，冇人睇緊，慳返效能；返去前景嗰陣會補call一次同步返畫面。
  const p=phase;
  let prog;
  if(p==='run'||p==='soon'){ const e=t/B.soon; prog=reduce?e:e*e*(3-2*e); } else prog=1;
  const pos=(idx+prog)*GAP;
  rail.style.transform=`translateX(${rail.parentElement.clientWidth/2-pos}px)`;
  $('train').style.left=pos+'px';
  rail.querySelectorAll('.stop').forEach(e=>
    e.classList.toggle('on',Number(e.dataset.k)===(prog===1?idx+1:idx)));
  let a=0;
  if(p==='open') a=(t-B.soon)/T.open;
  else if(p==='dwell') a=1;
  else if(p==='close') a=1-(t-B.dwell)/T.close;
  doors(Math.max(0,Math.min(1,a)));
}

let last=performance.now();
function loop(now){
  if(!tabHidden){
    const dt=Math.min((now-last)/1000,.25)*speed; last=now;
    if(running) advance(dt);
    voiceTick(); // 就算呢個frame冇轉phase，都要check吓係咪有pending緊嘅報站等running返嚟先播
    driveAudio(dt,phase);
    renderFrame();
  }
  requestAnimationFrame(loop);
}

/* ═══ 背景播放：setInterval頂替rAF（rAF喺收埋分頁嗰陣唔會再由瀏覽器call） ═══
   BG_TICK_MS淨係「上限」，實際頻率會受瀏覽器背景分頁節流（例如Chrome
   分頁收埋超過5分鐘之後，會將背景timer進一步節流到大約每分鐘一次）——
   呢個係瀏覽器本身嘅省電機制，唔係bug；advance()嘅逐邊界推進設計已經
   保證縱使兩次tick之間隔好耐，都唔會漏站、唔會令idx錯亂。dt本身唔設
   人為上限（用返真實經過咗嘅時間），先可以喺返嚟前景嗰陣令行程真正
   反映走咗幾耐；只有guard（loop次數上限）做安全網，防止極端情況
   （例如系統時鐘跳動）令while loop失控。 */
const BG_TICK_MS=300;
function bgTick(){
  const now=performance.now();
  const dtReal=Math.max((now-bgLast)/1000,0);
  bgLast=now;
  const dt=dtReal*speed;
  if(running) advance(dt);
  voiceTick();
  driveAudio(dt,phase);
}
function startBgTimer(){
  if(bgTimerId) return;
  bgLast=performance.now();
  bgTimerId=setInterval(bgTick,BG_TICK_MS);
}
function stopBgTimer(){
  if(bgTimerId){ clearInterval(bgTimerId); bgTimerId=null; }
}

/* ═══ 操作 ═══ */
function setDirLabel(){
  const eff=effOuter(idx+1);
  let label=CUR.dirLabels[eff?0:1];
  if(pendingDir!==null) label+=`　→　下一程轉：${CUR.dirLabels[pendingDir==='out'?0:1]}`;
  $('dirLabel').textContent=label;
  /* 自動折返之後effOuter會變、但dirMode／揀開嗰粒掣本身唔會自動跟住郁——
     每次update方向標籤都順便同步返方向掣嘅aria-pressed，等佢反映返
     「而家實際行緊邊個方向」，唔會出現折返完，個掣仲揀住去程嗰粒嘅怪現象。
     pendingDir未生效嗰粒掣用返.pending樣式標示「待套用」，唔會當佢
     已經生效（aria-pressed唔會提早設做true）。 */
  if(dirMode!=='alt'){
    const seg=$('dirSeg');
    if(seg) [...seg.children].forEach(x=>{
      if(x.dataset.dir==='out'||x.dataset.dir==='in'){
        x.setAttribute('aria-pressed', String((x.dataset.dir==='out')===eff));
        x.classList.toggle('pending', pendingDir===x.dataset.dir);
      }
    });
  }
}
function buildDirSeg(){
  let html=`<button data-dir="out" aria-pressed="true">${CUR.dirLabels[0]}</button>`+
           `<button data-dir="in" aria-pressed="false">${CUR.dirLabels[1]}</button>`;
  if(CUR.topology==='loop') html+='<button data-dir="alt" aria-pressed="false">每圈調頭</button>';
  $('dirSeg').innerHTML=html;
}
function buildSelStart(){
  const sel=$('selStart'); sel.innerHTML='';
  S.forEach(s=>{const o=document.createElement('option');
    o.value=s.no; o.textContent=`${CUR.badge}${s.no}　${s.kanji}`; sel.appendChild(o);});
}
function switchLine(id){
  const L=LINES[id]; if(!L||L===CUR){ if(L) CUR=L; return; }
  CUR=L; S=L.stations;
  document.documentElement.style.setProperty('--uguisu',L.color);
  document.documentElement.style.setProperty('--uguisu-deep',L.colorDeep);
  $('jyBadge').textContent=L.badge; $('lineName').textContent=L.name;
  $('plateL').textContent=L.badge; $('trainStripe').setAttribute('fill',L.color);
  $('footnote').innerHTML=L.footnote;
  outer=true; dirMode='out'; lapMark=0; idx=0; t=0; phase=''; genId++; pendingDir=null;
  stopSpeech();
  buildDirSeg(); buildSelStart(); setDirLabel(); strip(); paint();
}
$('btnSound').onclick=initAudio;
/* ═══ 「🔎 測試報站」（v1.2.2新增）═══
   真機report「有車廂聲、冇報站、又冇任何error」呢個組合，單靠估分唔到
   究竟係邊一種failure，所以要有個即場測試掣，將關鍵狀態直接寫返出嚟：
   - 呢粒掣係「用戶手指撳落嗰一刻」同步call speak()，冇任何setTimeout。
     如果撳呢粒掣有聲、但自動報站冇聲 → 即係「延遲call speak()喺手機
     會俾封鎖」呢類問題，要改報站嘅觸發方式。
   - 如果連呢粒掣都冇聲，就要睇埋下面逐項顯示：語音數量、有冇fire
     onstart（＝引擎有冇真係開始讀）、有冇fire onend、有冇error、
     speaking/pending/paused三個狀態——onstart有fire但完全冇聲，通常
     係音訊路由／靜音掣／同Web Audio爭audio session；onstart根本冇
     fire，就係utterance入咗queue但引擎唔肯開工。 */
$('btnTestVoice').onclick=()=>{
  if(!window.speechSynthesis){ voiceDiag('⚠️ 呢個瀏覽器完全冇speechSynthesis呢個功能。','warn'); return; }
  const t0=Date.now(), log=[];
  const show=()=>voiceDiag('<b>🔎 報站語音測試</b><br>'+log.join('<br>'),'info');
  const v=refreshVoices();
  const ja=v.filter(x=>x.lang&&x.lang.toLowerCase().startsWith('ja')).length;
  const en=v.filter(x=>x.lang&&x.lang.toLowerCase().startsWith('en')).length;
  log.push(`語音數量：${v.length}（日文 ${ja} 個、英文 ${en} 個）`);
  log.push(`車廂聲AudioContext：${ac?ac.state:'未開'}`);
  show();
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('つぎは、東京、東京です。');
    u.lang='ja-JP'; u.volume=1; u.rate=1;
    const vo=v.find(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'))||v[0]||null;
    if(vo){
      try{ u.voice=vo; log.push(`用緊語音：${vo.name}（${vo.lang}）`); }
      catch(err){ log.push(`揀語音失敗（${err.message||err}），改用瀏覽器預設`); }
    }
    else log.push('用緊語音：冇揀到（交返俾瀏覽器預設）');
    u.onstart=()=>{ log.push(`✅ ${Date.now()-t0}ms：引擎話開始讀緊（如果呢刻仲係一啲聲都冇，就係部機將把聲收咗埋，唔係個app冇叫佢讀）`); show(); };
    u.onend  =()=>{ log.push(`✅ ${Date.now()-t0}ms：讀完`); show(); };
    u.onerror=e=>{ log.push(`❌ ${Date.now()-t0}ms：出錯 — ${e.error||'未知'}`); show(); };
    window.__testUtt=u;                       // 強引用，防止俾GC食咗
    speechSynthesis.speak(u);
    log.push(`已經叫咗瀏覽器讀（speaking=${speechSynthesis.speaking}／pending=${speechSynthesis.pending}／paused=${speechSynthesis.paused}）`);
    show();
    setTimeout(()=>{
      log.push(`⏱ 3秒後：speaking=${speechSynthesis.speaking}／pending=${speechSynthesis.pending}／paused=${speechSynthesis.paused}`);
      if(!/開始讀緊/.test(log.join(''))) log.push('⚠️ 由頭到尾都冇fire過onstart＝引擎根本冇開工，唔係音量問題。');
      show();
    },3000);
  }catch(e){ log.push(`❌ 直接掟咗個錯誤出嚟：${e.message||e}`); show(); }
};
$('btnBg').onclick=e=>{
  bgPlayback=!bgPlayback;
  e.target.setAttribute('aria-pressed',bgPlayback);
  e.target.textContent=bgPlayback?'開啟':'關閉';
  // 一般都係喺前景撳呢粒掣，冇即時效果（淨係影響之後收埋分頁嗰刻）；
  // 呢度加多重保險：萬一啱啱好喺分頁已經收埋緊嗰陣撳到（例如靠device
  // bridge遙控），即刻套用返新嘅開／關狀態，唔使等落一次visibilitychange。
  if(tabHidden){
    if(bgPlayback&&running) startBgTimer();
    else{ stopBgTimer(); if(ac&&ac.state==='running') ac.suspend(); stopSpeech(); }
  }
};
$('btnRun').onclick=e=>{
  initAudio(); running=!running;
  e.target.textContent=running?'▶ 運行中':'⏸ 停低咗';
  e.target.classList.toggle('on',running);
  if(!running) stopSpeech();
};
$('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  dirMode=b.dataset.dir; lapMark=0; pendingDir=null;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  /* 比較要用effOuter（而家實際行緊嗰個方向），唔可以淨係比較初始嘅
     outer——直線來回路線折返咗之後，outer本身唔會變，如果淨係同outer
     比較，撳落一粒其實同「現正方向」一致嘅掣，都會誤判做「要切方向」。
     以前呢度一有唔同就即刻jumpTo()——但jumpTo會將t/phase重設去開門
     階段，行緊駛／停緊站中途撳掣就會即刻teleport去前方站，好突兀。
     而家改做：淨係記低pendingDir，等而家呢程真正行完（下一次
     close→run出發，喺enter()嗰度處理）先套用，keep返抵達方向嘅站同
     開門資料完整，唔會半路跳站。撳返一粒同現正方向一致嘅掣（前面
     已經pendingDir=null）就等於取消個pending轉向。 */
  if(dirMode!=='alt'){ const want=dirMode==='out';
    if(want!==effOuter(idx+1)) pendingDir=dirMode; }
  setDirLabel(); paint();
};
$('spdSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  speed=Number(b.dataset.spd);
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
};
$('btnVoice').onclick=e=>{
  voiceOn=!voiceOn; e.target.setAttribute('aria-pressed',voiceOn);
  e.target.textContent=voiceOn?'🔊 日＋英':'🔇 靜音報站';
  if(!voiceOn) stopSpeech();
};
$('btnMuteAll').onclick=e=>{
  /* 「全部靜音」：連車廂聲都一齊即刻收埋，同淨係關報站嘅btnVoice
     唔同（唔好將呢兩粒掣搞混）。開咗即刻set sfx.gain.value=0，唔等
     driveAudio()嗰個逐frame慢慢ramp（避免撳落去嗰下仲聽到一瞬間
     殘留車廂聲）；亦即刻stopSpeech()cancel緊講緊嗰句、清空queue。
     解除嗰陣乜都唔使做，driveAudio()自然會慢慢ramp返去你原本set
     嘅vol／voiceOn設定，annReq/voicedAnn亦都會補播返「現正」嗰句
     報站，唔會漏、唔會播錯咗舊嘢。 */
  masterMute=!masterMute;
  e.target.setAttribute('aria-pressed',masterMute);
  e.target.textContent=masterMute?'開啟':'關閉';
  if(masterMute){
    if(sfx) sfx.gain.value=0;
    stopSpeech();
  }
};
$('rate').oninput=e=>rate=Number(e.target.value);
$('vol').oninput=e=>vol=Number(e.target.value);

function jumpTo(no){
  const list=order(),k=list.findIndex(s=>s.no===no);
  idx=k-1; t=B.soon+.01; phase=''; lapMark=0; genId++; pendingDir=null;
  stopSpeech();
  strip(); paint();
}
$('selStart').onchange=e=>{ initAudio(); jumpTo(e.target.value); };

/* ═══ 乘客／全螢幕模式：隱藏開發者控制列，淨係留返個顯示屏本身 ═══ */
let passengerMode=false;
function setPassengerMode(on){
  passengerMode=on;
  document.querySelector('.unit').classList.toggle('passenger',on);
  const b=$('btnPassenger');
  b.textContent=on?'⤢':'⛶';
  b.title=on?'退出乘客模式':'乘客模式（隱藏控制項，全螢幕顯示）';
}
$('btnPassenger').onclick=e=>{
  e.stopPropagation();
  setPassengerMode(!passengerMode);
  if(passengerMode){
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  }else if(document.fullscreenElement&&document.exitFullscreen){
    document.exitFullscreen().catch(()=>{});
  }
};
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&passengerMode) setPassengerMode(false);
});

const selLine=$('selLine');
Object.values(LINES).forEach(L=>{const o=document.createElement('option');
  o.value=L.id; o.textContent=`${L.badge} ${L.name}`; selLine.appendChild(o);});
selLine.value=CUR.id;
selLine.onchange=e=>{ initAudio(); switchLine(e.target.value); };

$('appVer').textContent=APP_VERSION;
buildDirSeg(); buildSelStart(); setDirLabel(); strip(); paint(); requestAnimationFrame(loop);
</script>
</body>
</html>
